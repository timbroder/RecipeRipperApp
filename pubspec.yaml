name: recipe_ripper
description: A Flutter app that extracts structured recipes from cooking videos using on-device ML
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.2

  # Database (Sprint 0)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # State Management (Sprint 0)
  provider: ^6.1.1

  # Storage (Sprint 0)
  shared_preferences: ^2.2.2

  # Utilities (Sprint 0)
  intl: ^0.18.1
  uuid: ^4.2.1

  # Video handling (Sprint 1)
  video_player: ^2.8.1
  file_picker: ^10.0.0
  video_thumbnail: ^0.5.3

  # HTTP & File downloading (Sprint 1)
  dio: ^5.4.0
  youtube_explode_dart: ^2.0.2

  # Video processing (Sprint 2)
  # Using community fork after original FFmpegKit was retired
  ffmpeg_kit_flutter_new: ^4.1.0

  # Notifications (Sprint 2)
  flutter_local_notifications: ^17.0.0

  # Background processing (Sprint 2)
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.9
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Assets will be added as needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
