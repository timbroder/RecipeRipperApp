name: recipe_ripper
description: A Flutter app that extracts structured recipes from cooking videos using on-device ML
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.2

  # Database (Sprint 0)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # State Management (Sprint 0)
  provider: ^6.1.1

  # Storage (Sprint 0)
  shared_preferences: ^2.2.2

  # Utilities (Sprint 0)
  intl: ^0.18.1
  uuid: ^4.2.1

  # Video handling (Sprint 1)
  video_player: ^2.8.1
  file_picker: ^10.0.0
  # Thumbnails come from FFmpeg (see VideoService._generateThumbnail);
  # video_thumbnail was dropped because it doesn't build with Gradle 9.

  # HTTP & File downloading (Sprint 1)
  dio: ^5.4.0
  youtube_explode_dart: ^3.1.0

  # HTML parsing for Instagram/TikTok video extraction
  html: ^0.15.4

  # Video processing (Sprint 2)
  # Using community fork after original FFmpegKit was retired.
  # 4.3.0+ ships an arm64 iOS-simulator slice (required by Xcode 26+/iOS 27 sims).
  ffmpeg_kit_flutter_new: ^4.3.0

  # Notifications (Sprint 2)
  flutter_local_notifications: ^17.0.0

  # Background processing (Sprint 2)
  # 0.10.6+ builds with AGP 9 and android.builtInKotlin=false.
  workmanager: ^0.10.6

  # Export/Import and Sharing (Sprint 5)
  share_plus: ^10.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.1

  # Google Drive Sync (Sprint 5)
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.9
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Assets will be added as needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
